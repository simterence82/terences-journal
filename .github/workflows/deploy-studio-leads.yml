name: Deploy Studio Leads to Firebase Hosting

on:
  push:
    branches: [master]
    paths: ["studio-leads/**"]
  pull_request:
    paths: ["studio-leads/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-leads
    outputs:
      configured: ${{ steps.check-config.outputs.configured }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studio-leads/package-lock.json
      - id: check-config
        run: |
          if [ -n "${{ vars.STUDIO_LEADS_FIREBASE_PROJECT_ID }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Studio Leads deploy -- set the STUDIO_LEADS_FIREBASE_* repo variables and STUDIO_LEADS_FIREBASE_SERVICE_ACCOUNT secret first (see studio-leads/README.md)."
          fi
      - if: steps.check-config.outputs.configured == 'true'
        run: npm ci
      - if: steps.check-config.outputs.configured == 'true'
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.STUDIO_LEADS_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.STUDIO_LEADS_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.STUDIO_LEADS_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.STUDIO_LEADS_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.STUDIO_LEADS_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.STUDIO_LEADS_FIREBASE_APP_ID }}
      - if: steps.check-config.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: studio-leads-dist
          path: studio-leads/dist
          retention-days: 1

  deploy-preview:
    needs: build
    if: needs.build.outputs.configured == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: studio-leads-dist
          path: studio-leads/dist
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.STUDIO_LEADS_FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.STUDIO_LEADS_FIREBASE_PROJECT_ID }}
          entryPoint: studio-leads

  deploy-production:
    needs: build
    if: needs.build.outputs.configured == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: studio-leads-dist
          path: studio-leads/dist
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.STUDIO_LEADS_FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.STUDIO_LEADS_FIREBASE_PROJECT_ID }}
          entryPoint: studio-leads
          channelId: live
